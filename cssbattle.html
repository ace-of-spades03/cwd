<!doctype html>
<html>
<head>
	<style>
	:sz{10 * vw}
	body{background-color:#12219A;margin:3%;}
	#square, #circle{position:absolute;width:var(--sz);height:var(--sz);}
#square{background-color:#70CCDB;}
#circle{border-radius:100%;background-color:#DB5EAD;}
</style>
</head>
<body>
	<div id="square"></div>
	<div id="circle"style="left:15%"></div>
	<div id="circle"style="right:15%"></div>
	<div id="square"style="right:3%"></div>
	<div id="square"style="left:15%;bottom:3%"></div>
	<div id="circle"style="bottom:3%"></div>
	<div id="square"style="right:15%;bottom:3%"></div><div id="circle"style="right:3%;bottom:3%"></div>
</body></html>
