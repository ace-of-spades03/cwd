	<!-- 
	About this page:
	This page uses early internet aesthetics to show off the "Horizon" series ("Horizon Zero Dawn" and "Horizon Forbidden West"). I thought
	that it would be interesting to show off the games in this style because of how technology is inherently imbedded in the story of the
	game. As well, since the passage of time is important to the story, playing with a time using old aethestics for a new game is a fun nod
	to that aspect of the game.

	For this project, I wanted to make a page that looks like what Aloy or another person in the game might make in GeoCities to categorize
	the different types of machines. I chose the most iconic machines (in my mind) since there were so many. I was inspired by
	https://geocities.restorativland.org/WestHollywood/1039/frame.html

	This specific page is the entry for the Fanghorn.
	-->
