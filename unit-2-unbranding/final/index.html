<!doctype html>
<html>
<head>

	<!--
	About this page:
		For this page, I wanted to critique extreme brand loyalty more generally, but I wanted to do this by using Apple more specifically. People have a cult-like following for many brands which I find to be problematic at best, and I wanted this page to show how they justify poor products as brand loyalty. 

		For the first part of the page, it is a real ad that Apple made. I found the image at this website: https://appleinsider.com/articles/17/05/22/new-apple-ads-redone-switch-site-sell-android-users-on-iphone-perks
		
		Then, I used the mouseover effect to change the text for the ad to comment on how Apple price-gouges. However, I didn't want to stop there, so I made it so that when you click on the phone, it takes you to a different page I made. That page comments more specifically on the problems that Apple users ignore for brand loyalty. That page also used the mouseover effect to show those problems.
	-->
	<title>Worse for More</title>
	<style>
		/*Style here is used to mimic the original ad*/

	body {
		/*I referenced this website to get the gradient: https://www.w3schools.com/css/css3_gradients.asp
		and this website to get the background to work: https://www.w3schools.com/cssref/css3_pr_background-size.php*/
		background-image: linear-gradient(to bottom, #4C8797, #8FCEDF);
		background-repeat: no-repeat;
		/*Wanted it to fill the browser height-wise*/
		background-size: auto 1500px;
		font-family: Helvetica, Arial, sans-serif;
		text-align: center;
		color: white;
	}
	h1 {
		margin-top: 100px;
		font-size: 60px;
	}
	h2{
		font-size: 30px;
		font-weight: lighter;
	}
	#phone {
		/*Makes the phone image exist*/
		width: 613px;
		height: 80px;
		margin-top: 250px;
		margin-left: auto;
		margin-right: auto;
		/*I used CSP to crop this image*/
		background-image: url(../assets/img/phone.png);
	}
	</style>
	
</head>
<body>
	<h1 id="text">Life is Easier on uPhone.</h1>
	<h2>And that starts as soon as you turn it on.</h2>
	<a href="./apple.html">
		<div id="phone"></div>
	</a>
	<script>
		// Referenced: https://www.w3schools.com/js/js_events_mouse.asp
		const text = 
		document.getElementById("text");

		text.addEventListener("mouseover", function(){
			text.innerHTML="Life is More Expensive on uPhone.";
		});

		text.addEventListener("mouseout", function(){
			text.innerHTML="Life is Easier on uPhone.";
		});
	</script>
</body>
</html>
